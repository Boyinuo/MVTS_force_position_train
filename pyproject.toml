[project]
name = "mvts-force-position-train"
version = "0.1.0"
description = "Visual-acoustic tactile position and six-axis wrench training pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10,<13",
    "torch>=2.6,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
